<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="robots" content="noindex, nofollow">
<title>联系车主</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, #eef1f6 55%, #e6eaf1 100%);
    color:#101828;
    display:flex; align-items:center; justify-content:center;
    padding:24px 22px calc(24px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  .card {
    width:100%; max-width:380px; text-align:center;
    background:#ffffff;
    border:1px solid rgba(16,24,40,.06);
    border-radius:26px;
    box-shadow:0 24px 64px -16px rgba(16,24,40,.22), 0 2px 10px rgba(16,24,40,.05);
    padding:34px 26px 30px;
    animation:rise .45s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise {
    from { opacity:0; transform:translateY(14px) scale(.985); }
    to   { opacity:1; transform:none; }
  }

  .plate {
    display:inline-flex; align-items:center; gap:7px;
    height:30px; padding:0 13px; border-radius:999px;
    background:#101828; color:#fff;
    font-size:13px; font-weight:600; letter-spacing:.6px;
  }
  .plate i { width:5px; height:5px; border-radius:50%; background:#4ade80; font-style:normal; }

  h1 {
    margin-top:22px;
    font-size:25px; font-weight:700; letter-spacing:-.2px; line-height:1.3;
  }
  .sub {
    margin-top:10px; font-size:14.5px; line-height:1.65; color:#5b6474;
  }

  .call {
    margin-top:26px;
    display:flex; align-items:center; justify-content:center; gap:9px;
    height:60px; border-radius:16px;
    background:#101828; color:#fff; text-decoration:none;
    font-size:18px; font-weight:700; letter-spacing:.5px;
    box-shadow:0 10px 26px -8px rgba(16,24,40,.55);
    transition:transform .12s ease, box-shadow .2s ease, background .2s ease;
  }
  .call:active { transform:scale(.975); box-shadow:0 6px 16px -8px rgba(16,24,40,.5); }
  .call svg { flex:none; }

  .hint {
    margin-top:16px; font-size:12.5px; color:#98a1b0; letter-spacing:.2px;
  }

  .divider { margin:24px auto 0; width:44px; height:1px; background:#e2e6ee; }
  .note { margin-top:18px; font-size:12.5px; line-height:1.7; color:#9aa3b2; }

  /* 自动唤起时的浮层提示 */
  .dialing {
    position:fixed; inset:0; z-index:9;
    display:none; align-items:center; justify-content:center;
    background:rgba(238,241,246,.82);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  }
  .dialing.on { display:flex; }
  .dialing .box {
    background:#fff; border-radius:20px; padding:26px 30px;
    box-shadow:0 24px 60px -16px rgba(16,24,40,.28);
    text-align:center; animation:rise .3s ease both;
  }
  .spinner {
    width:26px; height:26px; margin:0 auto 14px;
    border:2.5px solid #e6eaf1; border-top-color:#101828;
    border-radius:50%; animation:spin .7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .dialing p { font-size:14px; color:#5b6474; }
</style>
</head>
<body>

<div class="card">
  <div class="plate"><i></i>临时停车</div>

  <h1>车主等你联系</h1>
  <p class="sub">车辆挡住了你的路，<br>点击下方按钮直接呼叫车主。</p>

  <a class="call" id="callBtn" href="#" rel="nofollow">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
    </svg>
    立即呼叫
  </a>

  <p class="hint">点击后由手机直接拨出，不必记号码</p>

  <div class="divider"></div>
  <p class="note">仅用于挪车联系<br>接通后请说明车辆位置，谢谢</p>
</div>

<div class="dialing" id="dialing">
  <div class="box">
    <div class="spinner"></div>
    <p>正在打开拨号…</p>
  </div>
</div>

<script>
(function () {
  /* 号码分段拼接，避免直接出现在页面源码里 */
  /* 号码以 base64 存放，避免明文出现在公开仓库 */
  var p = atob('MTgyOTcxMjYzNjA=');
  var tel = 'tel:' + p;

  var btn = document.getElementById('callBtn');
  var mask = document.getElementById('dialing');

  btn.setAttribute('href', tel);

  function go() {
    try { mask.classList.add('on'); } catch (e) {}
    window.location.href = tel;
    /* 用户从拨号界面返回时，把浮层收起来 */
    setTimeout(function () { mask.classList.remove('on'); }, 2600);
  }

  /* 不拦截默认行为：让浏览器/微信原生处理 tel: 链接，兼容性最好。
     微信内 JS 改 location 可能被拦，原生链接点击则可正常唤起拨号。 */
  btn.addEventListener('click', function () {
    mask.classList.add('on');
    setTimeout(function () { mask.classList.remove('on'); }, 2600);
  });

  /* 打开即尝试唤起拨号盘。
     普通浏览器会直接弹拨号；微信可能拦截（拦了也无害，下面的按钮仍可点）。 */
  setTimeout(function () {
    try { window.location.href = tel; } catch (e) {}
  }, 480);
})();
</script>
</body>
</html>
